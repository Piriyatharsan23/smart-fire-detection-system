<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A sealed chamber with an LED emitting a direct beam that misses the LDR receiver; smoke particles in the beam path scatter light sideways toward the LDR, which sits at roughly 90 degrees to the emitter axis.</desc>
